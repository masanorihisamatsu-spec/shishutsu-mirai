[alembic]
script_location = alembic
prepend_sys_path = .

# 実際の接続文字列は env.py 内で app.core.config.settings から上書きされる。
# ここでの値は alembic.ini 単体でパースされた際のフォールバック。
sqlalchemy.url = sqlite:///./database/app.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
